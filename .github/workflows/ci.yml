name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: no

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: cliff.toml
          args: --unreleased --strip header --offline
        env:
          GITHUB_REPO: ${{ github.repository }}

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # cargo-llvm-cov's --fail-under-* flags do not actually enforce the
      # threshold in 0.8.x, so parse the TOTAL line ourselves and gate on it.
      - name: Enforce ≥85% region and line coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --locked --summary-only | tee /tmp/cov.out
          total=$(grep '^TOTAL' /tmp/cov.out)
          regions=$(echo "$total" | awk '{print $4}' | tr -d '%')
          lines=$(echo "$total" | awk '{print $10}' | tr -d '%')
          echo "region coverage: ${regions}%, line coverage: ${lines}%"
          awk -v r="$regions" -v l="$lines" 'BEGIN {
            if (r + 0 < 85 || l + 0 < 85) {
              printf "FAIL: regions=%s%%, lines=%s%% — minimum is 85%%\n", r, l
              exit 1
            }
            printf "PASS: regions=%s%%, lines=%s%%\n", r, l
          }'

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all
